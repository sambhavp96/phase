# Supabase pauses free projects after about a week without activity, which would take the app
# offline. This runs a tiny read every 3 days so that never happens.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL                  e.g. https://YOUR-PROJECT-ID.supabase.co
#   SUPABASE_PUBLISHABLE_KEY      the sb_publishable_... key from .env.local
name: Keep Supabase awake

on:
  schedule:
    - cron: '23 14 */3 * *'
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read the minimum app versions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "$SUPABASE_URL/rest/v1/app_versions?select=platform" \
            -H "apikey: $SUPABASE_KEY"
